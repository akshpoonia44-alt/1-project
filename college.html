<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KIET University | Ghaziabad | Delhi-NCR</title>

    <meta name="description"
          content="KIET University, Delhi-NCR, Ghaziabad - Explore programs, admissions, campus facilities, schools, academics and student life.">

    <style>
        /* =========================
           GLOBAL STYLES
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        :root {
            --primary: #0b3d91;
            --secondary: #f4a900;
            --dark: #111827;
            --light: #f5f7fb;
            --white: #ffffff;
            --text: #444;
            --green: #16803c;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            line-height: 1.6;
            background: #fff;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        ul {
            list-style: none;
        }

        img {
            max-width: 100%;
            display: block;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: auto;
        }

        .section {
            padding: 80px 0;
        }

        .section-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title h2 {
            font-size: 38px;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .section-title p {
            max-width: 700px;
            margin: auto;
            color: #666;
        }

        .btn {
            display: inline-block;
            padding: 13px 25px;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.3s;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: var(--secondary);
            color: #111;
        }

        .btn-primary:hover {
            background: #d99100;
            transform: translateY(-2px);
        }

        .btn-blue {
            background: var(--primary);
            color: white;
        }

        .btn-blue:hover {
            background: #082e6c;
        }


        /* =========================
           TOP BAR
        ========================== */

        .top-bar {
            background: var(--dark);
            color: white;
            padding: 9px 0;
            font-size: 14px;
        }

        .top-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
        }

        .top-links {
            display: flex;
            gap: 20px;
        }

        .top-links a:hover {
            color: var(--secondary);
        }


        /* =========================
           NAVBAR
        ========================== */

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: white;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }

        .navbar {
            min-height: 78px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-box {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            border: 4px solid var(--secondary);
        }

        .logo-text h1 {
            font-size: 21px;
            color: var(--primary);
            line-height: 1.1;
        }

        .logo-text span {
            font-size: 11px;
            color: #666;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            color: #333;
            font-size: 15px;
            font-weight: 600;
        }

        .nav-links a:hover {
            color: var(--primary);
        }

        .menu-btn {
            display: none;
            border: none;
            background: var(--primary);
            color: white;
            padding: 10px 14px;
            border-radius: 5px;
            font-size: 20px;
            cursor: pointer;
        }


        /* =========================
           HERO
        ========================== */

        .hero {
            min-height: 650px;
            display: flex;
            align-items: center;
            position: relative;
            color: white;

            background:
                linear-gradient(
                    rgba(4, 29, 75, 0.84),
                    rgba(4, 29, 75, 0.84)
                ),
                url("https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=1800&q=80");

            background-size: cover;
            background-position: center;
        }

        .hero-content {
            max-width: 750px;
        }

        .hero-content .tag {
            display: inline-block;
            background: var(--secondary);
            color: #111;
            padding: 7px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .hero h2 {
            font-size: 58px;
            line-height: 1.1;
            margin-bottom: 20px;
        }

        .hero h2 span {
            color: var(--secondary);
        }

        .hero p {
            font-size: 19px;
            max-width: 680px;
            margin-bottom: 30px;
            color: #e5e7eb;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }


        /* =========================
           NOTICE BAR
        ========================== */

        .notice {
            background: var(--secondary);
            color: #111;
            padding: 12px 0;
            overflow: hidden;
        }

        .notice-inner {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .notice strong {
            white-space: nowrap;
        }


        /* =========================
           ABOUT
        ========================== */

        .about-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .about-image {
            min-height: 430px;
            border-radius: 15px;
            background:
                linear-gradient(
                    rgba(11,61,145,0.2),
                    rgba(11,61,145,0.2)
                ),
                url("https://images.unsplash.com/photo-1498243691581-b145c3f54a5a?auto=format&fit=crop&w=1000&q=80");
            background-size: cover;
            background-position: center;
        }

        .about-content h3 {
            color: var(--primary);
            font-size: 32px;
            margin-bottom: 15px;
        }

        .about-content p {
            margin-bottom: 15px;
        }

        .feature-list {
            margin: 25px 0;
        }

        .feature-list li {
            margin-bottom: 12px;
        }

        .feature-list li::before {
            content: "✓";
            color: var(--green);
            font-weight: bold;
            margin-right: 10px;
        }


        /* =========================
           STATS
        ========================== */

        .stats {
            background: var(--primary);
            color: white;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            text-align: center;
        }

        .stat h3 {
            font-size: 42px;
            color: var(--secondary);
        }

        .stat p {
            font-size: 15px;
        }


        /* =========================
           SCHOOLS
        ========================== */

        .schools {
            background: var(--light);
        }

        .school-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .school-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            border-top: 5px solid var(--primary);
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
            transition: 0.3s;
        }

        .school-card:hover {
            transform: translateY(-8px);
        }

        .school-icon {
            font-size: 38px;
            margin-bottom: 15px;
        }

        .school-card h3 {
            color: var(--primary);
            margin-bottom: 10px;
        }


        /* =========================
           COURSES
        ========================== */

        .course-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .course-card {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            overflow: hidden;
            background: white;
            transition: 0.3s;
        }

        .course-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.1);
        }

        .course-header {
            background: var(--primary);
            color: white;
            padding: 22px;
        }

        .course-header h3 {
            font-size: 20px;
        }

        .course-body {
            padding: 22px;
        }

        .course-body p {
            margin-bottom: 12px;
        }

        .course-body .duration {
            color: var(--green);
            font-weight: bold;
        }


        /* =========================
           ADMISSION
        ========================== */

        .admission {
            background: var(--light);
        }

        .admission-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
        }

        .admission-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06);
        }

        .admission-card h3 {
            color: var(--primary);
            margin-bottom: 20px;
            font-size: 26px;
        }

        .steps {
            counter-reset: admission;
        }

        .steps li {
            counter-increment: admission;
            position: relative;
            padding: 15px 15px 15px 55px;
            border-bottom: 1px solid #eee;
        }

        .steps li::before {
            content: counter(admission);
            position: absolute;
            left: 0;
            top: 12px;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }


        /* =========================
           FACILITIES
        ========================== */

        .facility-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .facility {
            text-align: center;
            padding: 30px 15px;
            border-radius: 10px;
            background: var(--light);
        }

        .facility .icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .facility h3 {
            color: var(--primary);
            font-size: 18px;
        }


        /* =========================
           CAMPUS
        ========================== */

        .campus {
            background: var(--light);
        }

        .campus-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .campus-card {
            min-height: 220px;
            border-radius: 12px;
            padding: 25px;
            display: flex;
            align-items: end;
            color: white;
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
        }

        .campus-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
        }

        .campus-card div {
            position: relative;
            z-index: 2;
        }

        .campus-card h3 {
            font-size: 23px;
        }

        .campus-1 {
            background-image: url("https://images.unsplash.com/photo-1541339907198-e08756dedf3f?auto=format&fit=crop&w=800&q=80");
        }

        .campus-2 {
            background-image: url("https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=800&q=80");
        }

        .campus-3 {
            background-image: url("https://images.unsplash.com/photo-1576495199011-eb94736f05d6?auto=format&fit=crop&w=800&q=80");
        }


        /* =========================
           WHY KIET
        ========================== */

        .why-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
        }

        .why-card {
            padding: 28px;
            border-radius: 12px;
            background: white;
            box-shadow: 0 5px 18px rgba(0,0,0,0.07);
            border-left: 5px solid var(--secondary);
        }

        .why-card h3 {
            color: var(--primary);
            margin-bottom: 8px;
        }


        /* =========================
           CTA
        ========================== */

        .cta {
            background:
                linear-gradient(
                    rgba(11,61,145,0.92),
                    rgba(11,61,145,0.92)
                ),
                url("https://images.unsplash.com/photo-1497633762265-9d179a990aa6?auto=format&fit=crop&w=1800&q=80");

            background-size: cover;
            background-position: center;
            color: white;
            text-align: center;
        }

        .cta h2 {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .cta p {
            max-width: 700px;
            margin: 0 auto 25px;
        }


        /* =========================
           CONTACT
        ========================== */

        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .contact-info {
            background: var(--primary);
            color: white;
            padding: 35px;
            border-radius: 12px;
        }

        .contact-info
