<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .block{
            display: block;
            width: 200px;
            background-color: rgb(236, 61, 61);
            padding: 10px;
            border: 2px solid rgb(42, 13, 230);
        }
        .block:hover{
            background-color: rgb(12, 219, 54);
            color: rgb(224, 189, 12);
        }   
        .inline-block{
            display: inline-block;
            width: 200px;
            padding: 10px;
            background-color: rgb(36, 12, 219);
            border: 2px solid rgb(236, 61, 61);
            margin: 5px;
        }
        .none{
            display: none;
        }
    </style>
    
</head>
<body>
    <h2>1. Block </h2>
    <div class="block">box 1</div>
    <div class="block">box 2</div>
    <div class="block">box 3</div>

     
    
</body>
</html>
