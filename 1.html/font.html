<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>font</title>
    <style>
        h1 {
            font-family: Arial, sans-serif;
            font-size: 24px;
            font-weight: bold;
            font-style: italic;
        }
        p {
            font-family: Georgia, serif;
            font-size: 16px;
            font-weight: normal;
            font-style: normal;
        }
    </style>
</head>
<body>
    <h1>This is a heading</h1>
    <p>This is a paragraph.</p> 
</body>
</html>
