<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSL colors</title>
    <style>
        h1 {
            color: hsl(0, 100%, 50%); /* Red */
        }
        p {
            color: hsl(240, 100%, 50%); /* Blue */
        }   
        </style>
</head>
<body>
    <h1>Red heading</h1>
    <p>This is a paragraph with a blue color.</p>
</body>
</html>
