<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>border</title>
    <style>
        h1 {
            border: 2px solid black;
            padding: 10px;
            margin: 20px;
        }
        p {
            border: 1px dashed blue;
            padding: 5px;
            margin: 10px;
        }       
        </style>     
</head>
<body>
    
    <h1>This is a heading with a border</h1>
    <p>This is a paragraph with a dashed border.</p>    
</body>
</html>
